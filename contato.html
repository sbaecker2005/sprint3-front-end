<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contato - Sabarah Flow</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="assets/css/custom.css" />
    </head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top bg-custom navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">Sabarah Flow</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link HOME_ACTIVE" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link FUNCIONA_ACTIVE" href="como-funciona.html">Como Funciona</a></li>
              <li class="nav-item"><a class="nav-link BENEFICIOS_ACTIVE" href="beneficios.html">Benefícios</a></li>
              <li class="nav-item"><a class="nav-link SOBRE_ACTIVE" href="sobre.html">Sobre Nós</a></li>
              <li class="nav-item"><a class="nav-link CONTATO_ACTIVE" href="contato.html">Contato</a></li>
            </ul>
          </div>
        </div>
      </nav>
      
    <main class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="text-center mb-4">
                    <i class="bi bi-envelope-paper-fill display-4 text-primary"></i>
                    <h1 class="mt-3">Fale Conosco</h1>
                    <p class="lead">Entre em contato para saber mais sobre o Sabarah Flow. Teremos prazer em responder!</p>
                </div>
                <form>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" placeholder="Seu nome">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" placeholder="Seu e-mail">
                    </div>
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone (opcional)</label>
                        <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000">
                    </div>
                    <div class="mb-3">
                        <label for="mensagem" class="form-label">Mensagem</label>
                        <textarea class="form-control" id="mensagem" rows="4" placeholder="Digite sua mensagem..."></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary rounded-pill">Enviar Mensagem</button>
                    </div>
                    <p class="text-center mt-3">Responderemos o mais breve possível!</p>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0" style="font-size: 0.9rem;">&copy; 2025 Sabarah Flow. Feito com ❤️ para cuidar de quem mais importa.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
